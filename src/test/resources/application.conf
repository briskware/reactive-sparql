#
# check the reference.conf in .../pekko-actor_2.13-1.0.x.jar!/reference.conf for all defined settings
#

pekko {
  #
  # Pekko version, checked against the runtime version of Pekko.
  #
  version = "1.0.2"

  loglevel = "DEBUG"

  # Some versions of Stardog need this limit extended
  http.client.parsing {
    max-response-reason-length = 4096
  }

  actor {
    debug {
      #
      # enable DEBUG logging of actor lifecycle changes
      #
      lifecycle = on
    }
  }
}
